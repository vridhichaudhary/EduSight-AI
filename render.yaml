services:
  # PostgreSQL Database
  - type: pgo
    name: edusight-db
    plan: free
    databaseName: sppredictor_db
    user: postgres

  # Redis for Celery Broker/Cache
  - type: redis
    name: edusight-redis
    plan: free
    ipAllowList: [] # Allow internal access only

  # Web Service (Django API)
  - type: web
    name: edusight-api
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: ./entrypoint.sh
    plan: free
    healthCheckPath: /api/rag/status/ # Verify API is up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edusight-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: edusight-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DB_ENGINE
        value: "django.db.backends.postgresql"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        # Vercel URL can be updated later if needed, wildcards generally aren't secure but can be used or explicitly set to front-end domain
        value: "https://edusight-ai.vercel.app" 
      # LLM API Keys to be populated manually
      - key: GOOGLE_API_KEY
        sync: false

  # Celery Background Worker
  - type: worker
    name: edusight-celery
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: celery -A config worker --loglevel=info
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edusight-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: edusight-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: edusight-api
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: "False"
      - key: GOOGLE_API_KEY
        sync: false
