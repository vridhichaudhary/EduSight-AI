databases:
  # PostgreSQL Database (managed, free tier)
  - name: edusight-db
    databaseName: sppredictor_db
    user: edusight_user
    plan: free

services:
  # Redis for Celery Broker/Cache
  - type: keyvalue
    name: edusight-redis
    plan: free
    ipAllowList: []

  # Web Service (Django API)
  - type: web
    name: edusight-api
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: ./entrypoint.sh
    plan: free
    healthCheckPath: /api/rag/status/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edusight-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: edusight-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://edusight-ai.vercel.app"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: GOOGLE_API_KEY
        sync: false
